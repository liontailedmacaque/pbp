<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Books | Playful Bible Press</title>
  <meta name="description" content="Books from Playful Bible Press.">

  <!-- Favicons -->
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="icon" href="/favicon.ico">
  <link rel="manifest" href="/site.webmanifest">

  <!-- Fonts are imported by the shared stylesheet. -->
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  {% include header.html %}

  <main>
    <section class="container page page--catalogue">
      <header class="page-heading">
        <p class="kicker">Playful Bible Press</p>
        <h1 class="page-title">Books</h1>
      </header>

      <article class="book-listing">
        <div class="book-listing__cover">
          <a href="/books/nebuchadnezzar/">
            <img class="book-cover"
              src="/images/neb/cover.png"
              alt="Cover of A Curious Letter from Nebuchadnezzar">
          </a>
        </div>

        <div class="book-listing__content">
          <h2 class="book-listing__title">
            A Curious Letter<br>
            <span class="text-rust">from Nebuchadnezzar</span>
          </h2>

          <p class="book-listing__description">
            King Nebuchadnezzar learns a lesson in pride.
            Illustrated and rhyming retelling of Daniel chapter 4.
          </p>

          <div class="button-group button-group--book-listing">
            <a class="button button--primary" href="/books/nebuchadnezzar/">
              Learn more
            </a>
            <a class="button button--secondary" href="/books/nebuchadnezzar/read/">
              Read online
            </a>
            <a class="button button--secondary"
              href="https://www.amazon.com/dp/1065449801?spcref=PRINT_LISTING"
              target="_blank" rel="noopener noreferrer">
              Buy on Amazon
            </a>
          </div>
        </div>
      </article>
    </section>
  </main>

  {% include footer.html %}
</body>
</html>
